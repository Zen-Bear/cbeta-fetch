[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbeta-fetch"
version = "0.2.1"
description = "CBETA 官方资源下载共享层（纯标准库）：URL 模板 / work id 大小写 / catalog / 下载与条件更新"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "CBETA User" }]
keywords = ["cbeta", "download", "cbdata", "xml-p5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
py-modules = ["cbeta_fetch"]
